name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python scripts/build_pages.py
      - run: npx playwright install --with-deps chromium
      - name: Test the static deployment
        run: |
          python -m http.server 8777 --bind 127.0.0.1 --directory reports/pages-preview &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/verify_pages.mjs
          node scripts/verify_learning.mjs
          node scripts/verify_book.mjs
          STUDIO_URL=http://127.0.0.1:8777/iconic-tutor node scripts/verify_village_browser.mjs
          STUDIO_URL=http://127.0.0.1:8777/iconic-tutor node scripts/verify_village_interaction.mjs
          STUDIO_URL=http://127.0.0.1:8777/iconic-tutor node scripts/verify_village_navigation.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: reports/pages-preview/iconic-tutor
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
